# CrowdSec to Cloudflare List Bouncer Configuration
api_url: http://127.0.0.1:8080/
api_key: ${CS_LAPI_KEY}
poll_interval: 10s
log_level: info
log_type: text
targets_dir: /etc/crowdsec/bouncers/cloudflare-list-targets.d/

# Maximum response body size from CrowdSec LAPI in megabytes (optional, default: 16, min: 16, max: 512).
# Increase this value if you synchronize very large decision lists (e.g. CAPI with 100k+ entries).
# max_response_body_mb: 16
