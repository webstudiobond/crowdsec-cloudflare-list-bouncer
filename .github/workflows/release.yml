name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build and Package
        run: |
          mkdir -p release_assets
          VERSION="${GITHUB_REF_NAME#v}"

          for arch in amd64 arm64; do
            echo "Building binary for linux/${arch}..."
            mkdir -p "build_linux_${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} go build \
              -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}'" \
              -o "build_linux_${arch}/crowdsec-cloudflare-list-bouncer" \
              ./cmd/crowdsec-cloudflare-list-bouncer

            cp LICENSE "build_linux_${arch}/"
            cp README.md "build_linux_${arch}/"

            cd "build_linux_${arch}"
            tar -czvf "../release_assets/crowdsec-cloudflare-list-bouncer_${VERSION}_linux_${arch}.tar.gz" ./*
            cd ..

            # Stage binary at repository root for nfpm packaging
            cp "build_linux_${arch}/crowdsec-cloudflare-list-bouncer" ./crowdsec-cloudflare-list-bouncer
            ARCH=${arch} VERSION=${VERSION} nfpm package --packager deb --target release_assets/
            ARCH=${arch} VERSION=${VERSION} nfpm package --packager rpm --target release_assets/
            rm -f ./crowdsec-cloudflare-list-bouncer
          done

      - name: Publish Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-assets
          path: |
            release_assets/*.deb
            release_assets/*.rpm

  sign:
    name: Sign Packages and Repositories
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Package Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-assets
          path: release_packages

      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Generate and Sign Repositories
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace \
            -e GPG_PRIVATE_KEY="${{ secrets.GPG_PRIVATE_KEY }}" \
            -e GPG_PASSPHRASE="${{ secrets.GPG_PASSPHRASE }}" \
            debian:trixie-slim sh -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends dpkg-dev apt-utils createrepo-c gnupg gzip
              bash /workspace/scripts/generate-repo.sh /workspace/release_packages /workspace/signed_repo /workspace/gh-pages-branch
            '

      - name: Upload Signed Repositories
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-repositories
          path: signed_repo/

  pages:
    name: Deploy to GitHub Pages
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Download Signed Repositories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-repositories
          path: signed_assets

      - name: Update Repository Files
        run: |
          mkdir -p gh-pages-branch/deb gh-pages-branch/rpm
          rm -rf gh-pages-branch/deb/* gh-pages-branch/rpm/*
          cp -r signed_assets/deb/* gh-pages-branch/deb/
          cp -r signed_assets/rpm/* gh-pages-branch/rpm/
          cd gh-pages-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all deb/ rpm/
          git commit -m "chore: update APT and RPM repositories for release ${{ github.ref_name }}" || echo "No changes to commit"
          git push
